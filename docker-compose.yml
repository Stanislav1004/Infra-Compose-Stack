
services:
  nginx:
    image: nginx:alpine
    container_name: bootcamp-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - web-app
    restart: always

  web-app:
    build: .
    container_name: bootcamp-web
    ports:
      - "8080:8080"
    restart: always

  cache:
    image: redis:7-alpine
    container_name: bootcamp-redis
    ports:
      - "6379:6379"
    restart: always
